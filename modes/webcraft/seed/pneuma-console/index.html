<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessions · Carbon Park</title>
  <link rel="stylesheet" href="assets/app.css?v=4">
  <link rel="stylesheet" href="assets/sessions.css?v=4">
</head>
<body data-page-title="Sessions">
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="rail" aria-label="Workspace">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true">
        <path d="M13 1.5 23 7.25v11.5L13 24.5 3 18.75V7.25Z" fill="oklch(0.42 0.095 152)"/>
        <path d="M13 7.5v11M9 11.5l4 3 4-3" fill="none" stroke="oklch(0.97 0.02 152)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text"><span class="brand-name" data-ws-name>Carbon Park</span><span class="brand-sub">Pneuma workspace</span></span>
    </a>
    <nav class="nav" aria-label="Console">
      <a href="index.html" aria-current="page"><span data-icon="sessions"></span><span class="lbl">Sessions</span><em class="count" data-active-count></em></a>
      <a href="usage.html"><span data-icon="usage"></span><span class="lbl">Usage</span></a>
      <a href="settings.html"><span data-icon="settings"></span><span class="lbl">Settings</span></a>
    </nav>
    <div class="rail-foot">
      <p class="sample-note">Sample workspace. Sessions, members, and costs are synthetic.</p>
      <div class="me" data-me></div>
    </div>
  </aside>
  <main class="main" id="main">
    <header class="page-head">
      <div>
        <h1>Sessions</h1>
        <p class="sub" id="today-line">Today</p>
      </div>
    </header>

    <section class="kpis" aria-label="Workspace summary" id="kpis"></section>

    <section class="sessions" aria-labelledby="table-title">
      <h2 id="table-title" class="visually-hidden">All sessions</h2>
      <div class="toolbar">
        <div class="tabs" role="tablist" aria-label="Filter by status" id="status-tabs"></div>
        <div class="toolbar-end">
          <label class="sort-mobile">
            <span class="visually-hidden">Sort sessions</span>
            <select class="select" id="sort-select">
              <option value="">Newest first</option>
              <option value="cost:desc">Cost, highest first</option>
              <option value="tokens:desc">Tokens, most first</option>
              <option value="runtime:desc">Runtime, longest first</option>
              <option value="status:asc">Status</option>
              <option value="title:asc">Session, A to Z</option>
              <option value="owner:asc">Owner, A to Z</option>
              <option value="mode:asc">Mode, A to Z</option>
              <option value="model:asc">Model, A to Z</option>
            </select>
          </label>
          <label class="input-affix search">
            <span class="visually-hidden">Search sessions</span>
            <span class="affix"><span data-icon="search"></span></span>
            <input class="input has-end" id="search" type="search" placeholder="Search sessions" autocomplete="off">
            <kbd class="affix-end" aria-hidden="true">/</kbd>
          </label>
        </div>
      </div>

      <div class="scope" id="scope" hidden>
        <span>Showing <strong id="scope-label"></strong></span>
        <button type="button" class="btn ghost sm" id="scope-clear"><span data-icon="x"></span>Show all sessions</button>
      </div>

      <div class="table-wrap" role="region" aria-label="Sessions table" tabindex="0">
        <table class="ledger" id="ledger">
          <thead>
            <tr>
              <th scope="col" data-key="title" class="col-session"><button type="button">Session</button></th>
              <th scope="col" data-key="mode"><button type="button">Mode</button></th>
              <th scope="col" data-key="owner"><button type="button">Owner</button></th>
              <th scope="col" data-key="model"><button type="button">Model</button></th>
              <th scope="col" data-key="status"><button type="button">Status</button></th>
              <th scope="col" data-key="runtime" class="r"><button type="button">Runtime</button></th>
              <th scope="col" data-key="tokens" class="r"><button type="button">Tokens</button></th>
              <th scope="col" data-key="cost" class="r"><button type="button">Cost</button></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
          <tfoot id="totals"></tfoot>
        </table>
        <div class="empty" id="empty" hidden>
          <h3>No sessions match</h3>
          <p id="empty-text"></p>
          <button type="button" class="btn" id="clear-filters">Clear filters</button>
        </div>
      </div>

      <div class="pager">
        <p class="pager-info num" id="pager-info" aria-live="polite"></p>
        <div class="pager-controls">
          <button type="button" class="btn sm" id="prev"><span data-icon="left"></span>Previous</button>
          <span class="num pager-page" id="page-of"></span>
          <button type="button" class="btn sm" id="next">Next<span data-icon="right"></span></button>
        </div>
      </div>
    </section>
  </main>

  <aside class="drawer" id="drawer" aria-labelledby="d-title" hidden>
    <div class="drawer-head">
      <div class="drawer-status" id="d-status"></div>
      <button type="button" class="btn ghost icon-only" id="d-close" aria-label="Close details"><span data-icon="x"></span></button>
    </div>
    <h2 class="drawer-title" id="d-title" tabindex="-1"></h2>
    <p class="drawer-event" id="d-event"></p>
    <div class="drawer-actions" id="d-actions"></div>
    <dl class="facts" id="d-facts"></dl>
    <section class="breakdown" aria-labelledby="d-bk">
      <h3 id="d-bk">Tokens and cost</h3>
      <div class="bk-bar" id="d-bar" aria-hidden="true"></div>
      <table class="bk-table" id="d-bk-table"></table>
      <p class="hint">Illustrative per-token rates for sample data.</p>
    </section>
  </aside>
</div>
<script src="assets/data.js?v=4"></script>
<script src="assets/app.js?v=4"></script>
<script src="assets/sessions.js?v=4"></script>
</body>
</html>
