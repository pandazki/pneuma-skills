<!DOCTYPE html>
<!-- ==================================================================
     DIAGRAM · Line Chart (kami palette)
     Trend lines for time-series or ordered data (stock price, growth rate, etc.)
     Up to 12 points × 3 lines. Demo: 8 months × 2 lines.
     The <svg> below is generated by the kami skill's scripts/chart.mjs from the spec in its
     data-kami-spec attribute. To fill it, write the data as a spec and run
     `node <skill>/scripts/chart.mjs spec.json -o chart.svg`; never edit
     coordinates by hand (`chart.mjs --check` compares the marks to the spec).
     ================================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Line Chart · kami diagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --parchment:    #f5f4ed;
    --ivory:        #faf9f5;
    --near-black:   #141413;
    --olive:        #504e49;
    --stone:        #6b6a64;
    --brand:        #1B365D;
    --brand-tint:   #EEF2F7;
    --border:       #e8e6dc;

    --serif: Charter, Georgia, Palatino, serif;
    --sans: var(--serif);
    --mono:  "JetBrains Mono", "SF Mono", Consolas, "TsangerJinKai02", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", monospace;
  }

  /* Poster-size page so WeasyPrint exports the full diagram without
     A4 clipping; browsers ignore @page. */
  @page { size: 1000px 960px; margin: 0; }

  body {
    font-family: var(--sans);
    background: var(--parchment);
    color: var(--near-black);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .frame { max-width: 920px; width: 100%; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--serif);
    font-size: 1.9rem;
    font-weight: 500;
    letter-spacing: -0.3pt;
    line-height: 1.15;
    margin-bottom: 1.6rem;
  }

  svg { width: 100%; min-width: 640px; display: block; }

  .caption {
    font-family: var(--serif);
    font-size: 0.95rem;
    color: var(--olive);
    margin-top: 1rem;
    max-width: 52ch;
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line Chart · kami diagram</p>
    <h1>{{Chart Title}}</h1>

      <circle cx="482" cy="96" r="3.5" fill="#f5f4ed" stroke="#504e49" stroke-width="1.5"/>

      <text x="662.6" y="36" fill="#1B365D" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" font-weight="500">96</text>

      <text x="50.5" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">Jan</text>

    </svg>

    <p class="caption">{{Caption text. The ink-blue line carries the primary trend argument. State what the trend means, not what was plotted.}}</p>
  </div>
</body>
</html>
