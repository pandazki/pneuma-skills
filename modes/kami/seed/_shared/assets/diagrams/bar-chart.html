<!DOCTYPE html>
<!-- ==================================================================
     DIAGRAM · Bar Chart (kami palette)
     Grouped bar chart for categorical comparison (revenue, market share, etc.)
     Up to 8 categories × 3 series. Demo: 4 quarters × 2 series.
     The <svg> below is generated by the kami skill's scripts/chart.mjs from the spec in its
     data-kami-spec attribute. To fill it, write the data as a spec and run
     `node <skill>/scripts/chart.mjs spec.json -o chart.svg`; never edit
     coordinates by hand (`chart.mjs --check` compares the marks to the spec).
     ================================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bar Chart · kami diagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --parchment:    #f5f4ed;
    --ivory:        #faf9f5;
    --near-black:   #141413;
    --olive:        #504e49;
    --stone:        #6b6a64;
    --brand:        #1B365D;
    --brand-tint:   #EEF2F7;
    --border:       #e8e6dc;

    --serif: Charter, Georgia, Palatino, serif;
    --sans: var(--serif);
    --mono:  "JetBrains Mono", "SF Mono", Consolas, "TsangerJinKai02", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", monospace;
  }

  /* Poster-size page so WeasyPrint exports the full diagram without
     A4 clipping; browsers ignore @page. */
  @page { size: 1000px 960px; margin: 0; }

  body {
    font-family: var(--sans);
    background: var(--parchment);
    color: var(--near-black);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .frame { max-width: 920px; width: 100%; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--serif);
    font-size: 1.9rem;
    font-weight: 500;
    letter-spacing: -0.3pt;
    line-height: 1.15;
    margin-bottom: 1.6rem;
  }

  svg { width: 100%; min-width: 640px; display: block; }

  .caption {
    font-family: var(--serif);
    font-size: 0.95rem;
    color: var(--olive);
    margin-top: 1rem;
    max-width: 52ch;
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar Chart · kami diagram</p>
    <h1>{{Chart Title}}</h1>

    <svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" data-kami-chart="bar" data-kami-spec="{&quot;categories&quot;:[&quot;2021&quot;,&quot;2022&quot;,&quot;2023&quot;,&quot;2024&quot;],&quot;series&quot;:[{&quot;name&quot;:&quot;{{Series A label}}&quot;,&quot;values&quot;:[44,60,72,88]},{&quot;name&quot;:&quot;{{Series B label}}&quot;,&quot;values&quot;:[32,48,64,76]}],&quot;type&quot;:&quot;bar&quot;,&quot;unit&quot;:&quot;{{Unit}}&quot;}">
      <rect width="100%" height="100%" fill="#f5f4ed"/>
      <line x1="50.5" y1="224" x2="676" y2="224" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="42.5" y="228" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">0</text>
      <line x1="50.5" y1="184" x2="676" y2="184" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="42.5" y="188" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">20</text>
      <line x1="50.5" y1="144" x2="676" y2="144" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="42.5" y="148" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">40</text>
      <line x1="50.5" y1="104" x2="676" y2="104" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="42.5" y="108" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">60</text>
      <line x1="50.5" y1="64" x2="676" y2="64" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="42.5" y="68" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">80</text>
      <line x1="50.5" y1="24" x2="676" y2="24" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="42.5" y="28" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">100</text>
      <text x="8" y="124" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" transform="rotate(-90 8 124)">{{Unit}}</text>
      <line x1="50.480000000000004" y1="224" x2="676" y2="224" stroke="#141413" stroke-width="0.8"/>
      <rect x="92.7" y="136" width="32" height="88" fill="#1B365D" rx="2"/>
      <text x="108.7" y="132" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">44</text>
      <rect x="132.7" y="160" width="32" height="64" fill="#504e49" rx="2"/>
      <text x="148.7" y="156" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">32</text>
      <text x="128.7" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">2021</text>
      <rect x="249.1" y="104" width="32" height="120" fill="#1B365D" rx="2"/>
      <text x="265.1" y="100" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">60</text>
      <rect x="289.1" y="128" width="32" height="96" fill="#504e49" rx="2"/>
      <text x="305.1" y="124" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">48</text>
      <text x="285.1" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">2022</text>
      <rect x="405.4" y="80" width="32" height="144" fill="#1B365D" rx="2"/>
      <text x="421.4" y="76" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">72</text>
      <rect x="445.4" y="96" width="32" height="128" fill="#504e49" rx="2"/>
      <text x="461.4" y="92" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">64</text>
      <text x="441.4" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">2023</text>
      <rect x="561.8" y="48" width="32" height="176" fill="#1B365D" rx="2"/>
      <text x="577.8" y="44" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">88</text>
      <rect x="601.8" y="72" width="32" height="152" fill="#504e49" rx="2"/>
      <text x="617.8" y="68" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">76</text>
      <text x="597.8" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">2024</text>
      <line x1="50.5" y1="268" x2="676" y2="268" stroke="#e8e7e1" stroke-width="0.8"/>
      <rect x="50.5" y="281" width="12" height="12" fill="#1B365D" rx="2"/>
      <text x="68.5" y="292" fill="#504e49" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Series A label}}</text>
      <rect x="221.4" y="281" width="12" height="12" fill="#504e49" rx="2"/>
      <text x="239.4" y="292" fill="#504e49" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Series B label}}</text>
    </svg>

    <p class="caption">{{Caption text. The focal series in ink-blue carries the primary argument. State the takeaway here, not a description of what is plotted.}}</p>
  </div>
</body>
</html>
