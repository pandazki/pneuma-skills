<!DOCTYPE html>
<!-- ==================================================================
     DIAGRAM · Waterfall Chart (kami palette)
     Revenue bridge / valuation decomposition / cash flow breakdown.
     Start value, positive/negative segments, end value.
     The <svg> below is generated by the kami skill's scripts/chart.mjs from the spec in its
     data-kami-spec attribute. To fill it, write the data as a spec and run
     `node <skill>/scripts/chart.mjs spec.json -o chart.svg`; never edit
     coordinates by hand (`chart.mjs --check` compares the marks to the spec).
     ================================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Waterfall Chart · kami diagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --parchment:    #f5f4ed;
    --ivory:        #faf9f5;
    --near-black:   #141413;
    --olive:        #504e49;
    --stone:        #6b6a64;
    --brand:        #1B365D;
    --brand-tint:   #EEF2F7;
    --border:       #e8e6dc;
    --positive:     #1B365D;
    --negative:     #6b6a64;
    --total:        #4d4c48;

    --serif: Charter, Georgia, Palatino, serif;
    --sans: var(--serif);
    --mono:  "JetBrains Mono", "SF Mono", Consolas, "TsangerJinKai02", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", monospace;
  }

  /* Poster-size page so WeasyPrint exports the full diagram without
     A4 clipping; browsers ignore @page. */
  @page { size: 1000px 940px; margin: 0; }

  body {
    font-family: var(--sans);
    background: var(--parchment);
    color: var(--near-black);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .frame { max-width: 920px; width: 100%; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--serif);
    font-size: 1.9rem;
    font-weight: 500;
    letter-spacing: -0.3pt;
    line-height: 1.15;
    margin-bottom: 1.6rem;
  }

  svg { width: 100%; min-width: 640px; display: block; }

  .caption {
    font-family: var(--serif);
    font-size: 0.95rem;
    color: var(--olive);
    margin-top: 1rem;
    max-width: 52ch;
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Waterfall · kami diagram</p>
    <h1>{{Chart Title}}</h1>

    <svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" data-kami-chart="waterfall" data-kami-spec="{&quot;items&quot;:[{&quot;label&quot;:&quot;{{Start}}&quot;,&quot;total&quot;:true,&quot;value&quot;:120},{&quot;label&quot;:&quot;{{Cat A}}&quot;,&quot;value&quot;:30},{&quot;label&quot;:&quot;{{Cat B}}&quot;,&quot;value&quot;:20},{&quot;label&quot;:&quot;{{Cat C}}&quot;,&quot;value&quot;:-40},{&quot;label&quot;:&quot;{{Cat D}}&quot;,&quot;value&quot;:10},{&quot;label&quot;:&quot;{{Cat E}}&quot;,&quot;value&quot;:-20},{&quot;label&quot;:&quot;{{End}}&quot;,&quot;total&quot;:true}],&quot;type&quot;:&quot;waterfall&quot;}">
      <rect width="100%" height="100%" fill="#f5f4ed"/>
      <line x1="28.5" y1="224" x2="716" y2="224" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="20.5" y="228" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">0</text>
      <line x1="28.5" y1="174" x2="716" y2="174" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="20.5" y="178" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">50</text>
      <line x1="28.5" y1="124" x2="716" y2="124" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="20.5" y="128" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">100</text>
      <line x1="28.5" y1="74" x2="716" y2="74" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="20.5" y="78" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">150</text>
      <line x1="28.5" y1="24" x2="716" y2="24" stroke="#e8e7e1" stroke-width="0.8"/>
      <text x="20.5" y="28" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="end">200</text>
      <rect x="45.6" y="104" width="64" height="120" fill="#4d4c48" rx="2"/>
      <text x="77.6" y="96" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">120</text>
      <text x="77.6" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Start}}</text>
      <line x1="109.6" y1="104" x2="143.8" y2="104" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="143.8" y="74" width="64" height="30" fill="#1B365D" rx="2"/>
      <text x="175.8" y="66" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">+30</text>
      <text x="175.8" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Cat A}}</text>
      <line x1="207.8" y1="74" x2="242" y2="74" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="242" y="54" width="64" height="20" fill="#1B365D" rx="2"/>
      <text x="274" y="46" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">+20</text>
      <text x="274" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Cat B}}</text>
      <line x1="306" y1="54" x2="340.2" y2="54" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="340.2" y="54" width="64" height="40" fill="#6b6a64" rx="2"/>
      <text x="372.2" y="108" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">-40</text>
      <text x="372.2" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Cat C}}</text>
      <line x1="404.2" y1="94" x2="438.5" y2="94" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="438.5" y="84" width="64" height="10" fill="#1B365D" rx="2"/>
      <text x="470.5" y="76" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">+10</text>
      <text x="470.5" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Cat D}}</text>
      <line x1="502.5" y1="84" x2="536.7" y2="84" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="536.7" y="84" width="64" height="20" fill="#6b6a64" rx="2"/>
      <text x="568.7" y="118" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">-20</text>
      <text x="568.7" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Cat E}}</text>
      <line x1="600.7" y1="104" x2="634.9" y2="104" stroke="#b8b7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <rect x="634.9" y="104" width="64" height="120" fill="#4d4c48" rx="2"/>
      <text x="666.9" y="96" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">120</text>
      <text x="666.9" y="246" fill="#141413" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{End}}</text>
      <line x1="28.5" y1="268" x2="716" y2="268" stroke="#e8e7e1" stroke-width="0.8"/>
      <rect x="28.5" y="281" width="12" height="12" fill="#1B365D" rx="2"/>
      <text x="46.5" y="292" fill="#504e49" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">Increase</text>
      <rect x="132.2" y="281" width="12" height="12" fill="#6b6a64" rx="2"/>
      <text x="150.2" y="292" fill="#504e49" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">Decrease</text>
      <rect x="236" y="281" width="12" height="12" fill="#4d4c48" rx="2"/>
      <text x="254" y="292" fill="#504e49" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">Total</text>
    </svg>

    <p class="caption">{{Caption: e.g. "Revenue bridge from FY2024 to FY2025, showing growth drivers and headwinds."}}</p>
  </div>
</body>
</html>
