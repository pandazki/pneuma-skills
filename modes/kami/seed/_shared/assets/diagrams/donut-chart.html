<!DOCTYPE html>
<!-- ==================================================================
     DIAGRAM · Donut Chart (kami palette)
     Proportional distribution (spend breakdown, user segments, etc.)
     Up to 6 segments. Demo: 6-segment revenue mix.
     The <svg> below is generated by the kami skill's scripts/chart.mjs from the spec in its
     data-kami-spec attribute. To fill it, write the data as a spec and run
     `node <skill>/scripts/chart.mjs spec.json -o chart.svg`; never edit
     coordinates by hand (`chart.mjs --check` compares the marks to the spec).
     ================================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Donut Chart · kami diagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --parchment:    #f5f4ed;
    --ivory:        #faf9f5;
    --near-black:   #141413;
    --olive:        #504e49;
    --stone:        #6b6a64;
    --brand:        #1B365D;
    --brand-tint:   #EEF2F7;
    --border:       #e8e6dc;

    --serif: Charter, Georgia, Palatino, serif;
    --sans: var(--serif);
    --mono:  "JetBrains Mono", "SF Mono", Consolas, "TsangerJinKai02", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", monospace;
  }

  /* Poster-size page so WeasyPrint exports the full diagram without
     A4 clipping; browsers ignore @page. */
  @page { size: 1000px 960px; margin: 0; }

  body {
    font-family: var(--sans);
    background: var(--parchment);
    color: var(--near-black);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .frame { max-width: 920px; width: 100%; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--serif);
    font-size: 1.9rem;
    font-weight: 500;
    letter-spacing: -0.3pt;
    line-height: 1.15;
    margin-bottom: 1.6rem;
  }

  svg { width: 100%; min-width: 640px; display: block; }

  .caption {
    font-family: var(--serif);
    font-size: 0.95rem;
    color: var(--olive);
    margin-top: 1rem;
    max-width: 52ch;
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Donut Chart · kami diagram</p>
    <h1>{{Chart Title}}</h1>

    <svg viewBox="0 0 680 286" xmlns="http://www.w3.org/2000/svg" role="img" data-kami-chart="donut" data-kami-spec="{&quot;center_label&quot;:&quot;{{Center label}}&quot;,&quot;items&quot;:[{&quot;label&quot;:&quot;{{Category A}}&quot;,&quot;value&quot;:32},{&quot;label&quot;:&quot;{{Category B}}&quot;,&quot;value&quot;:24},{&quot;label&quot;:&quot;{{Category C}}&quot;,&quot;value&quot;:18},{&quot;label&quot;:&quot;{{Category D}}&quot;,&quot;value&quot;:12},{&quot;label&quot;:&quot;{{Category E}}&quot;,&quot;value&quot;:8},{&quot;label&quot;:&quot;{{Category F}}&quot;,&quot;value&quot;:6}],&quot;source&quot;:&quot;{{Source / period}}&quot;,&quot;type&quot;:&quot;donut&quot;}">
      <rect width="100%" height="100%" fill="#f5f4ed"/>
      <path d="M 114 16 A 112 112 0 0 1 215.3 175.7 L 175.5 157 A 68 68 0 0 0 114 60 Z" fill="#1B365D"/>
      <path d="M 215.3 175.7 A 112 112 0 0 1 72.8 232.1 L 89 191.2 A 68 68 0 0 0 175.5 157 Z" fill="#504e49"/>
      <path d="M 72.8 232.1 A 112 112 0 0 1 2.2 135 L 46.1 132.3 A 68 68 0 0 0 89 191.2 Z" fill="#6b6a64"/>
      <path d="M 2.2 135 A 112 112 0 0 1 27.7 56.6 L 61.6 84.7 A 68 68 0 0 0 46.1 132.3 Z" fill="#b8b7b0"/>
      <path d="M 27.7 56.6 A 112 112 0 0 1 72.8 23.9 L 89 64.8 A 68 68 0 0 0 61.6 84.7 Z" fill="#d4d3cd"/>
      <path d="M 72.8 23.9 A 112 112 0 0 1 114 16 L 114 60 A 68 68 0 0 0 89 64.8 Z" fill="#EEF2F7" stroke="#e8e7e1" stroke-width="0.8"/>
      <circle cx="114" cy="128" r="112" fill="none" stroke="#f5f4ed" stroke-width="1.5"/>
      <circle cx="114" cy="128" r="68" fill="none" stroke="#f5f4ed" stroke-width="1.5"/>
      <text x="114" y="126" fill="#1B365D" font-size="30" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle" font-weight="500">32%</text>
      <text x="114" y="148" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" text-anchor="middle">{{Center label}}</text>
      <rect x="270" y="42" width="12" height="12" fill="#1B365D" rx="2"/>
      <text x="292" y="53" fill="#1B365D" font-size="14" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif" font-weight="500">32%</text>
      <text x="329.5" y="53" fill="#504e49" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category A}}</text>
      <rect x="270" y="74" width="12" height="12" fill="#504e49" rx="2"/>
      <text x="292" y="85" fill="#141413" font-size="14" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">24%</text>
      <text x="329.5" y="85" fill="#504e49" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category B}}</text>
      <rect x="270" y="106" width="12" height="12" fill="#6b6a64" rx="2"/>
      <text x="292" y="117" fill="#141413" font-size="14" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">18%</text>
      <text x="329.5" y="117" fill="#504e49" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category C}}</text>
      <rect x="270" y="138" width="12" height="12" fill="#b8b7b0" rx="2"/>
      <text x="292" y="149" fill="#141413" font-size="14" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">12%</text>
      <text x="329.5" y="149" fill="#504e49" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category D}}</text>
      <rect x="270" y="170" width="12" height="12" fill="#d4d3cd" rx="2"/>
      <text x="292" y="181" fill="#141413" font-size="14" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">8%</text>
      <text x="329.5" y="181" fill="#504e49" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category E}}</text>
      <rect x="270" y="202" width="12" height="12" fill="#EEF2F7" stroke="#e8e7e1" stroke-width="0.8" rx="2"/>
      <text x="292" y="213" fill="#141413" font-size="14" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">6%</text>
      <text x="329.5" y="213" fill="#504e49" font-size="12" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Category F}}</text>
      <text x="0" y="280" fill="#6b6a64" font-size="11" font-family="Charter, Georgia, Palatino, 'Times New Roman', serif">{{Source / period}}</text>
    </svg>

    <p class="caption">{{Caption text. The ink-blue segment is the focal category. Lead with the insight, not the breakdown.}}</p>
  </div>
</body>
</html>
